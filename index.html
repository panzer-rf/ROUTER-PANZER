<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - Juego de Serpiente</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐍 SNAKE GAME</h1>
            <p class="subtitle">Juego de la Serpiente</p>
        </div>

        <div class="game-info">
            <div class="info-box">
                <span class="label">Score:</span>
                <span class="value" id="score">0</span>
            </div>
            <div class="info-box">
                <span class="label">High Score:</span>
                <span class="value" id="highScore">0</span>
            </div>
        </div>

        <div class="game-container">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
        </div>

        <div class="controls">
            <div class="instructions">
                <h2>Controles:</h2>
                <p>⬆️⬇️⬅️➡️ Flechas o WASD para mover</p>
                <p>ESPACIO para pausar/reanudar</p>
                <p>R para reiniciar</p>
            </div>
            <button id="startBtn" class="btn btn-primary">Iniciar Juego</button>
            <button id="pauseBtn" class="btn btn-secondary" disabled>Pausar</button>
            <button id="restartBtn" class="btn btn-danger">Reiniciar</button>
        </div>

        <div class="status" id="status"></div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
